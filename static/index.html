<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Library Chat Assistant</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    #app {
      width: 420px;
      height: 620px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      background: #1a1a2e;
      color: white;
      padding: 16px 20px;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.3px;
    }

    header span {
      font-size: 0.75rem;
      font-weight: 400;
      opacity: 0.6;
      margin-left: 8px;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .bubble {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 0.875rem;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .bubble.user {
      align-self: flex-end;
      background: #1a1a2e;
      color: white;
      border-bottom-right-radius: 4px;
    }

    .bubble.assistant {
      align-self: flex-start;
      background: #f0f2f5;
      color: #1a1a2e;
      border-bottom-left-radius: 4px;
    }

    .bubble.system {
      align-self: center;
      background: transparent;
      color: #999;
      font-size: 0.75rem;
      padding: 4px 0;
    }

    #input-area {
      display: flex;
      gap: 8px;
      padding: 12px 16px;
      border-top: 1px solid #eee;
    }

    #input {
      flex: 1;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 0.875rem;
      outline: none;
      resize: none;
      height: 42px;
    }

    #input:focus { border-color: #1a1a2e; }

    #send {
      background: #1a1a2e;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 0 16px;
      font-size: 0.875rem;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    #send:disabled { opacity: 0.4; cursor: not-allowed; }

    #auth-bar {
      padding: 8px 16px;
      border-bottom: 1px solid #eee;
      display: flex;
      gap: 8px;
      align-items: center;
    }

    #auth-bar input {
      flex: 1;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 0.8rem;
      outline: none;
    }

    #auth-bar button {
      background: #eee;
      border: none;
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 0.8rem;
      cursor: pointer;
    }

    #auth-status {
      font-size: 0.75rem;
      color: #888;
      white-space: nowrap;
    }
  </style>
</head>
<body>
<div id="app">
  <header>
    Library Assistant <span id="auth-status">Guest</span>
  </header>

  <div id="auth-bar">
    <input id="token-input" type="text" placeholder="Paste JWT token to log in (optional)" />
    <button onclick="setToken()">Set</button>
    <button onclick="clearToken()">Clear</button>
  </div>

  <div id="messages"></div>

  <div id="input-area">
    <textarea id="input" placeholder="Ask me about books..."></textarea>
    <button id="send" onclick="sendMessage()">Send</button>
  </div>
</div>

<script>
  let sessionToken = null;
  let jwtToken = null;

  function setToken() {
    const val = document.getElementById("token-input").value.trim();
    if (!val) return;
    jwtToken = val;
    document.getElementById("auth-status").textContent = "Member";
    document.getElementById("token-input").value = "";
    appendBubble("system", "Logged in as member.");
  }

  function clearToken() {
    jwtToken = null;
    sessionToken = null;
    document.getElementById("auth-status").textContent = "Guest";
    appendBubble("system", "Logged out. New session on next message.");
  }

  function appendBubble(role, content) {
    const div = document.createElement("div");
    div.className = `bubble ${role}`;
    div.textContent = content;
    const container = document.getElementById("messages");
    container.appendChild(div);
    container.scrollTop = container.scrollHeight;
  }

  async function sendMessage() {
    const input = document.getElementById("input");
    const message = input.value.trim();
    if (!message) return;

    input.value = "";
    document.getElementById("send").disabled = true;
    appendBubble("user", message);

    const headers = { "Content-Type": "application/json" };
    if (jwtToken) headers["Authorization"] = `Bearer ${jwtToken}`;

    try {
      const res = await fetch("/chat", {
        method: "POST",
        headers,
        body: JSON.stringify({
          message,
          session_token: sessionToken,
        }),
      });

      const data = await res.json();
      sessionToken = data.session_token;
      appendBubble("assistant", data.reply);
    } catch (err) {
      appendBubble("system", "Error: could not reach server.");
    } finally {
      document.getElementById("send").disabled = false;
      input.focus();
    }
  }

  document.getElementById("input").addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });
</script>
</body>
</html>
